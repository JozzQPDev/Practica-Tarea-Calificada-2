<section class="relative min-h-screen w-full flex items-center justify-center overflow-x-hidden bg-neutral-900 text-white">

   <div class="absolute inset-0 w-full h-full z-0 select-none pointer-events-none flex items-center justify-center">
      <img src="/img/fondo.png" alt="Planta industrial de POLY" class="w-full h-full object-cover block">
    </div>

    <div class="relative z-10 mx-auto max-w-[1700px] w-full px-6 py-16 md:py-32 flex flex-col md:flex-row items-center justify-between gap-6">

        <div class="flex flex-col items-start gap-8 w-full md:w-auto">
            <h1 class="text-4xl md:text-8xl font-bold tracking-tight max-w-[1100px] leading-tight pt-12">
                Transforming Chemistry <br>
                Into Real-World<br>
                Solutions
            </h1>

            <p class="text-gray-400 text-base md:text-lg max-w-[520px] leading-relaxed">
                Discover cutting-edge chemical innovations designed to enhance sustainability and drive industry growth, ensuring a healthier planet for generations to come.
            </p>

            <div class="flex flex-wrap items-center gap-8 mt-12">
                <a href="/contact" class="inline-flex items-center gap-2 bg-[#b6e33e] text-neutral-950 px-10 py-3 font-semibold text-[25px] tracking-wide transition-all duration-200 hover:bg-[#a5cf34]">
                    Get in Touch
                    <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25" />
                    </svg>
                </a>

                <button class="inline-flex items-center gap-4 text-white px-5 py-3 font-medium text-[25px] tracking-wide transition-colors duration-200 hover:text-[#b6e33e] group">
                    Watch Video
                    <span class="flex items-center justify-center w-14 h-14 rounded-full border border-white/40 bg-[#b6e33e] backdrop-blur-sm transition-transform duration-200 group-hover:scale-105 group-hover:border-[#b6e33e]">
                        <svg xmlns="http://w3.org" fill="currentColor" viewBox="0 0 24 24" class="w-8 h-8 ml-0.5 text-black">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                    </span>
                </button>
            </div>
        </div>

        <div class="hidden lg:flex absolute right-0 top-80 flex-col items-center gap-28 z-20">
            @for (social of HeroSocial; track social.label) {
                <a [href]="social.url || '#'"
                  target="_blank"
                  class="text-[20px] font-medium tracking-widest text-white hover:text-[#b6e33e] transition-colors duration-200 -rotate-90 origin-center select-none block min-w-[80px] text-center">
                    {{ social.label }}
                </a>
            }
        </div>

    </div>
</section>
